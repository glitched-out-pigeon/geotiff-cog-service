name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install GDAL system deps
        run: sudo apt-get update && sudo apt-get install -y gdal-bin libgdal-dev

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install flake8

      - name: Lint
        run: flake8 app --max-line-length=120 --extend-ignore=E203,W503

      - name: Run tests
        run: pytest tests/ -v